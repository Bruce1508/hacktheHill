# Gemini model/prompt pins for Day 2 (§6.3, §8.5, §20). Confirmed live against
# the account's models.list() and a real embed_content/interactions.create call
# on 2026-09-29 — see docs/superpowers/plans/2026-09-28-day2-real-data-language.md.
# Changing any model_id or prompt_version is an intentional cache miss.
#
# extraction switched from gemini-flash-latest to gemini-flash-lite-latest on
# 2026-09-30: gemini-flash-latest hit a 20-requests/day Free Tier cap on
# 2026-09-29, then on 2026-09-30 (cap reset) failed with a 503 "high demand"
# error twice in a row on the same complaint, then an SSL connection error on
# a third direct test. gemini-flash-lite-latest was confirmed live against the
# real ComplaintExtraction schema at the same time (valid parse, real tokens:
# 49 in / 102 out) and is already the account's stable model for generation.

generation:
  model_id: gemini-flash-lite-latest
  prompt_version: dev-text-v2

extraction:
  model_id: gemini-flash-lite-latest
  prompt_version: extraction-v1

embedding:
  model_id: gemini-embedding-001
  output_dimensionality: 768 # must match app.complaint_embeddings.embedding column (migration 0003)
  prompt_version: embedding-v1

# Guardrail for a full dev run (~1,600 complaints => ~1,600 extraction +
# 1,600 embedding calls on a cold cache). Raise only with a deliberate reason.
max_calls_per_run: 5000

# Bounded concurrency for batched Gemini calls (§11) — no unbounded call loops.
max_concurrent_calls: 4

# Free Tier generate_content cap is 15 req/min; a worker at
# max_concurrent_calls=4 hit this in ~14s on 2026-10-03, and a sequential
# script with no pacing hit it again on 2026-10-04. Caps calls per rolling
# 60s window regardless of concurrency. Set below the published cap (not at
# it) — a real run on 2026-10-17 still hit a 429 at the exact limit of 15,
# likely send/arrival timing jitter versus Google's own window.
max_calls_per_minute: 12

# 100 per Gemini API docs, unverified live. embed_content accepts a list of
# contents in one request; this is the per-request item limit, so ~1,600
# complaints become ~16 requests instead of ~1,600 (Day 3 batching).
embedding_batch_size: 100

# When true, any provider call not already in llm_cache raises instead of
# reaching the network — used by CI and the fake-provider test suite.
cache_only: false
