services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - backtrace_db_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL_PIPELINE: postgresql+psycopg://bt_pipeline:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_MODE: ${AUTH_MODE}
    ports:
      - "8000:8000"

  worker:
    build:
      context: ../backend
    command: python -m backtrace.worker.main
    volumes:
      - ../configs:/app/configs:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL_PIPELINE: postgresql+psycopg://bt_pipeline:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PIPELINE_CONFIG_PATH: /app/configs/pipeline.yaml

  web:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ../apps/web:/app
    # package.json's "dev" script ends in "#" to swallow pnpm 12's forwarded -- args below;
    # do not remove that trailing "#" or this command will crash with a project-directory parse error.
    command: sh -c "corepack enable && pnpm install && pnpm dev -- --hostname 0.0.0.0"
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  backtrace_db_data:
