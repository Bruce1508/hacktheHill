name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: backtrace
          POSTGRES_USER: backtrace_owner
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backtrace_owner -d backtrace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://backtrace_owner:devpassword@localhost:5432/backtrace
      DATABASE_URL_PIPELINE: postgresql+psycopg://bt_pipeline:devpassword@localhost:5432/backtrace
      DATABASE_URL_EVAL: postgresql+psycopg://bt_eval:devpassword@localhost:5432/backtrace
      BT_PIPELINE_PASSWORD: devpassword
      BT_EVAL_PASSWORD: devpassword
      AUTH_MODE: dev
      GEMINI_API_KEY: ci-placeholder
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run alembic upgrade head
      - run: uv run python -m backtrace_eval.generator.cli generate --world-config ../configs/worlds/dev.yaml --out ../fixtures/dev
      - run: uv run python -m backtrace_eval.generator.load --fixture ../fixtures/dev --database-url $DATABASE_URL_EVAL
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
