<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Backtrace — resolve the incident, not the inbox</title>
  <desc id="desc">Black, white, and red product banner showing many complaint signals converging on a small set of operational incidents.</desc>
  <defs>
    <linearGradient id="red" x1="283" y1="128" x2="1288" y2="777" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6A6A"/>
      <stop offset="0.48" stop-color="#E11D48"/>
      <stop offset="1" stop-color="#8B0B22"/>
    </linearGradient>
    <linearGradient id="fade" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151515"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1266 430) rotate(90) scale(350 500)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E11D48" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="40" fill="url(#fade)"/>
  <rect width="1600" height="900" rx="40" fill="url(#grid)"/>
  <rect width="1600" height="900" rx="40" fill="url(#glow)"/>
  <rect x="1" y="1" width="1598" height="898" rx="39" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M40 2H390" stroke="url(#red)" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(80 78)">
    <rect width="328" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="24" cy="22" r="5" fill="#F43F5E"/>
    <text x="42" y="29" fill="#D8D8D8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" letter-spacing="2">HACK THE HILL 2026 · CIENA</text>
  </g>
  <g transform="translate(80 200)">
    <text fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-6">
      <tspan x="0" y="0">Back</tspan><tspan fill="#F43F5E">trace</tspan><tspan fill="#FFFFFF">.</tspan>
    </text>
    <text x="3" y="86" fill="#F2F2F2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="31" font-weight="700">10,000 complaints. A handful of causes.</text>
    <text x="3" y="148" fill="#A8A8A8" font-family="Inter, Arial, sans-serif" font-size="25">Resolve the incident — not the inbox.</text>
  </g>
  <g transform="translate(80 548)" filter="url(#shadow)">
    <rect width="660" height="184" rx="24" fill="#101010" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="1" y="1" width="7" height="182" rx="4" fill="url(#red)"/>
    <text x="40" y="48" fill="#777777" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3">EVIDENCE-FIRST ROOT CAUSE</text>
    <text x="40" y="91" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">complaints × events × telemetry</text>
    <path d="M40 119H620" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <g transform="translate(40 143)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600">
      <text fill="#F43F5E">1,600</text><text x="60" fill="#8D8D8D">dev complaints</text>
      <text x="225" fill="#F43F5E">768D</text><text x="278" fill="#8D8D8D">embeddings</text>
      <text x="430" fill="#F43F5E">HITL</text><text x="480" fill="#8D8D8D">approval</text>
    </g>
  </g>
  <g transform="translate(855 115)">
    <circle cx="350" cy="330" r="266" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <circle cx="350" cy="330" r="198" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="350" cy="330" r="118" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <g stroke="#FFFFFF" stroke-opacity="0.11">
      <path d="M72 124L301 274"/><path d="M68 255L301 301"/><path d="M74 414L301 349"/><path d="M115 556L313 388"/>
      <path d="M620 108L410 273"/><path d="M665 261L421 310"/><path d="M661 433L415 354"/><path d="M596 580L396 397"/>
    </g>
    <g fill="#FFFFFF" fill-opacity="0.72">
      <circle cx="72" cy="124" r="6"/><circle cx="108" cy="151" r="4"/><circle cx="47" cy="172" r="4"/>
      <circle cx="68" cy="255" r="7"/><circle cx="119" cy="273" r="4"/><circle cx="35" cy="299" r="5"/>
      <circle cx="74" cy="414" r="5"/><circle cx="116" cy="452" r="7"/><circle cx="40" cy="474" r="4"/>
      <circle cx="115" cy="556" r="6"/><circle cx="160" cy="590" r="4"/><circle cx="72" cy="610" r="5"/>
      <circle cx="620" cy="108" r="5"/><circle cx="665" cy="148" r="7"/><circle cx="602" cy="174" r="4"/>
      <circle cx="665" cy="261" r="6"/><circle cx="620" cy="294" r="4"/><circle cx="695" cy="322" r="5"/>
      <circle cx="661" cy="433" r="7"/><circle cx="615" cy="457" r="4"/><circle cx="701" cy="484" r="4"/>
      <circle cx="596" cy="580" r="5"/><circle cx="648" cy="604" r="6"/><circle cx="563" cy="626" r="4"/>
    </g>
    <circle cx="350" cy="330" r="102" fill="#E11D48" fill-opacity="0.18" filter="url(#blur)"/>
    <circle cx="350" cy="330" r="82" fill="#111111" stroke="url(#red)" stroke-width="3"/>
    <circle cx="350" cy="330" r="11" fill="#F43F5E"/>
    <circle cx="350" cy="330" r="23" stroke="#F43F5E" stroke-opacity="0.36"/>
    <path d="M350 244V270M350 390V416M264 330H290M410 330H436" stroke="#F43F5E" stroke-opacity="0.65" stroke-width="2"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2">
      <rect x="208" y="38" width="284" height="38" rx="19" fill="#0D0D0D" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="236" y="63" fill="#A8A8A8">MANY SIGNALS</text><text x="378" y="63" fill="#F43F5E">→ ONE CAUSE</text>
      <text x="278" y="462" fill="#FFFFFF">INCIDENT COHORT</text>
    </g>
  </g>
  <g transform="translate(80 828)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" letter-spacing="1.5">
    <text fill="#666666">SYNTHETIC DATA · HUMAN-IN-THE-LOOP · EVERY HYPOTHESIS CITES EVIDENCE</text>
    <text x="1274" fill="#F43F5E">01 / TRACE</text>
  </g>
</svg>
